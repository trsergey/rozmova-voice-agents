[project]
name = "rozmova-engine"
version = "0.1.0"
description = "Dialogue engine: flow executor, LLM providers, tools, RAG, eval runner."
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9", "rozmova-contracts", "rozmova-core"]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rozmova_engine"

[tool.uv.sources]
rozmova-contracts = { workspace = true }
rozmova-core = { workspace = true }
