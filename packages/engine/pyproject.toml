[project]
name = "rozmova-engine"
version = "0.1.0"
description = "Dialogue engine: flow executor, LLM providers, tools, RAG, eval runner."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.13,<2",
    "httpx2>=2.13,<3",
    "openai>=3.31,<4",
    "prometheus-client>=0.23",
    "pydantic>=2.9",
    "pyyaml>=6.0.3",
    "rozmova-contracts",
    "rozmova-core",
    "structlog>=26.1.0",
    "tiktoken>=0.9",
]

[project.optional-dependencies]
evals = [
    "deepeval>=4.3.0",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rozmova_engine"

[tool.uv.sources]
rozmova-contracts = { workspace = true }
rozmova-core = { workspace = true }
