# Alembic config for the Rozmova schema. Run from the repo root: `make migrate`.
# The database URL comes from ROZMOVA_DATABASE_URL (rozmova_core.settings), not from here.

[alembic]
# Migrations ship inside the rozmova_core package, so this works from any directory
# and from an installed wheel.
script_location = rozmova_core:migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
