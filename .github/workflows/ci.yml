# Every PR and every push to main: lint, tests (unit + integration on Docker), contracts,
# then the service images (pushed to GHCR from main only).
# Integration tests start PostgreSQL (pgvector) and Redis with testcontainers, the same
# code path as locally; GitHub's Ubuntu runners have Docker.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff, mypy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (uv.lock must be up to date)
        run: uv sync --all-packages --locked
      - run: make lint

  test:
    name: test (pytest, PostgreSQL and Redis via testcontainers, migrations up/down)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv run pytest

  contracts:
    name: contracts (JSON Schema and TS types committed)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync --all-packages --locked
      - run: make schemas
      - name: Generated files match the commit
        run: git diff --exit-code packages/contracts || (echo "::error::run 'make schemas' and commit the result" && exit 1)

  images:
    name: image ${{ matrix.target }} (build; push to GHCR on main)
    needs: [lint, test, contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [gateway, admin-api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # PRs only build (the Dockerfile stays working); main also pushes, tagged by commit,
      # which is what the deploy job (ROZ-44) runs.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/trsergey/rozmova-${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
