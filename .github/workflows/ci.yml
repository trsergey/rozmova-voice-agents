# Every PR and every push to main: lint, tests (unit + integration on Docker), contracts,
# the admin-web checks, then the service images (pushed to GHCR except on PRs).
# main deploys to Railway `dev`, a tag v* releases to `demo` (infra/deploy.py: switch the
# images, wait, smoke test, roll back on failure). A manual run deploys its ref to dev.
# Integration tests start PostgreSQL (pgvector) and Redis with testcontainers, the same
# code path as locally; GitHub's Ubuntu runners have Docker.
# Evals with the real model (eval.yml): the fast subset on PRs that touch the bot's
# behaviour (informational), the full set before a release (blocking).
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Only PR runs are cancelled by a newer push: a deploy must never stop halfway through
  # a rollback.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff, mypy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (uv.lock must be up to date; extras so mypy sees deepeval)
        run: uv sync --all-packages --all-extras --locked
      - run: make lint

  test:
    name: test (pytest, PostgreSQL and Redis via testcontainers, migrations up/down)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv run pytest

  contracts:
    name: contracts (JSON Schema, OpenAPI and TS types committed)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync --all-packages --locked
      - run: make schemas
      - run: make client
      - name: Generated files match the commit
        run: git diff --exit-code packages/contracts apps/admin-api/openapi.json apps/admin-web/src/api-schema.d.ts || (echo "::error::run 'make schemas client' and commit the result" && exit 1)

  web:
    name: web (eslint, tsc, vitest, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  images:
    name: image ${{ matrix.target }} (build; push to GHCR except on PRs)
    needs: [lint, test, contracts, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [gateway, admin-api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # PRs only build (the Dockerfile stays working); main, tags and manual runs also
      # push, tagged by commit, which is what the deploy jobs run.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/trsergey/rozmova-${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  changes:
    name: changes (does the PR touch the bot's behaviour?)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      evals: ${{ steps.diff.outputs.evals }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.base_ref }}
        # Flows and prompts, eval cases and thresholds, the knowledge base, the engine
        # (LLM layer, tools, RAG, runner) and the flow contract.
        run: |
          changed=$(git diff --name-only "origin/$BASE...HEAD")
          echo "$changed"
          if echo "$changed" | grep -qE \
              '^(flows/|evals/|kb/|packages/engine/|packages/contracts/src/rozmova_contracts/flow\.py$)'; then
            echo "evals=true" >> "$GITHUB_OUTPUT"
          else
            echo "evals=false" >> "$GITHUB_OUTPUT"
          fi

  # Evals cost money: they wait for lint and tests, so broken code is never evaluated.
  eval-pr:
    name: evals (fast, informational)
    needs: [changes, lint, test]
    if: needs.changes.outputs.evals == 'true'
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: ./.github/workflows/eval.yml
    with:
      subset: fast
    secrets: inherit

  eval-release:
    name: evals (full, blocks the release)
    needs: [lint, test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: ./.github/workflows/eval.yml
    with:
      subset: full
    secrets: inherit

  deploy-dev:
    name: deploy to Railway dev
    needs: [images]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps: &deploy-steps
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: npm install --global @railway/cli@5.68.0
      - name: Deploy, smoke test, roll back on failure
        env:
          # A Railway project token scoped to this environment (GitHub environment secret).
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          # An access code (viewer) for the smoke test's full call; skipped when unset.
          SMOKE_ACCESS_CODE: ${{ secrets.SMOKE_ACCESS_CODE }}
        run: >-
          uv run python infra/deploy.py
          --environment ${{ vars.RAILWAY_ENVIRONMENT }}
          --sha ${{ github.sha }}
          --gateway-url ${{ vars.GATEWAY_URL }}
          --admin-url ${{ vars.ADMIN_URL }}

  release:
    name: release to Railway demo
    needs: [images, eval-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: demo
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    steps: *deploy-steps
