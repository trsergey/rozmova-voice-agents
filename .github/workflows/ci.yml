# Every PR and every push to main: lint, tests (unit + integration on Docker), contracts,
# then the service images (pushed to GHCR except on PRs).
# main deploys to Railway `dev`, a tag v* releases to `demo` (infra/deploy.py: switch the
# images, wait, smoke test, roll back on failure). A manual run deploys its ref to dev.
# Integration tests start PostgreSQL (pgvector) and Redis with testcontainers, the same
# code path as locally; GitHub's Ubuntu runners have Docker.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Only PR runs are cancelled by a newer push: a deploy must never stop halfway through
  # a rollback.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff, mypy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (uv.lock must be up to date)
        run: uv sync --all-packages --locked
      - run: make lint

  test:
    name: test (pytest, PostgreSQL and Redis via testcontainers, migrations up/down)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv run pytest

  contracts:
    name: contracts (JSON Schema and TS types committed)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync --all-packages --locked
      - run: make schemas
      - name: Generated files match the commit
        run: git diff --exit-code packages/contracts || (echo "::error::run 'make schemas' and commit the result" && exit 1)

  images:
    name: image ${{ matrix.target }} (build; push to GHCR except on PRs)
    needs: [lint, test, contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [gateway, admin-api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # PRs only build (the Dockerfile stays working); main, tags and manual runs also
      # push, tagged by commit, which is what the deploy jobs run.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/trsergey/rozmova-${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  deploy-dev:
    name: deploy to Railway dev
    needs: [images]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps: &deploy-steps
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: npm install --global @railway/cli@5.68.0
      - name: Deploy, smoke test, roll back on failure
        env:
          # A Railway project token scoped to this environment (GitHub environment secret).
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: >-
          uv run python infra/deploy.py
          --environment ${{ vars.RAILWAY_ENVIRONMENT }}
          --sha ${{ github.sha }}
          --gateway-url ${{ vars.GATEWAY_URL }}
          --admin-url ${{ vars.ADMIN_URL }}

  release:
    name: release to Railway demo
    needs: [images]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: demo
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    steps: *deploy-steps
