# Scrapes /metrics of the apps running on the host.
# Targets stay "down" until the apps are started and expose metrics.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: admin-api
    static_configs:
      - targets: ["host.docker.internal:8001"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
