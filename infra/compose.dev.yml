# Local development stack: data stores and observability.
# Apps run on the host (`uv run ...`) and reach these services on localhost.
# Usage: `make up` / `make down` (see Makefile). Ports bind to 127.0.0.1 only.
# The `apps` profile also runs the service images (`make up-apps`), as Railway does.

name: rozmova-dev

services:
  postgres:
    # PG 16 is pinned: the data path below changed in PG 18 (SDD, Railway notes).
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_USER: rozmova
      POSTGRES_PASSWORD: rozmova
      POSTGRES_DB: rozmova
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rozmova -d rozmova"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  jaeger:
    # Jaeger v2 all-in-one: OTLP gRPC 4317, OTLP HTTP 4318, UI 16686, health 13133.
    image: jaegertracing/jaeger:2.11.0
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:16686:16686"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:13133/status"]
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.7.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # Lets Prometheus scrape apps running on the host, on Linux as well as macOS.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- The service images (Dockerfile at the repo root), profile `apps` ---------------------
  gateway:
    profiles: [apps]
    build:
      context: ..
      target: gateway
    image: rozmova-gateway:dev
    environment: &app-env
      ROZMOVA_ENV: local
      ROZMOVA_DATABASE_URL: postgresql+asyncpg://rozmova:rozmova@postgres:5432/rozmova
      ROZMOVA_REDIS_URL: redis://redis:6379/0
      ROZMOVA_TICKET_SECRET: local-dev-ticket-secret
      ROZMOVA_ADMIN_EMAIL: admin@rozmova.local
      ROZMOVA_ADMIN_PASSWORD: local-dev-admin-password
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      # The LLM key from the host environment; the greeting works without a real one.
      ROZMOVA_DEMO_API_KEY: ${ROZMOVA_DEMO_API_KEY:-not-set}
    ports:
      - "127.0.0.1:8001:8001"
    # Graceful shutdown drains calls for up to 50 s before exiting.
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin-api:
    profiles: [apps]
    build:
      context: ..
      target: admin-api
    image: rozmova-admin-api:dev
    environment: *app-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
