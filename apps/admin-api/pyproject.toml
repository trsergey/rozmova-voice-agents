[project]
name = "rozmova-admin-api"
version = "0.1.0"
description = "Admin API: bots, drafts, versions, calls, auth, eval jobs."
requires-python = ">=3.12,<3.13"
dependencies = ["rozmova-contracts", "rozmova-core", "rozmova-engine"]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "admin_api"

[tool.uv.sources]
rozmova-contracts = { workspace = true }
rozmova-core = { workspace = true }
rozmova-engine = { workspace = true }
