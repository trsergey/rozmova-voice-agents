[project]
name = "rozmova-gateway"
version = "0.1.0"
description = "Dialogue gateway: WebSocket sessions on top of the engine."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.120",
    "prometheus-client>=0.23",
    "rozmova-contracts",
    "rozmova-core",
    "rozmova-engine",
    "uvicorn[standard]>=0.38",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gateway"

[tool.uv.sources]
rozmova-contracts = { workspace = true }
rozmova-core = { workspace = true }
rozmova-engine = { workspace = true }
