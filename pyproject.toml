[project]
name = "rozmova"
version = "0.1.0"
description = "Rozmova: a voice-agent platform for telecom subscribers (text channel MVP)."
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/gateway", "apps/admin-api", "packages/*"]

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pyyaml>=6.0.3",
    "ruff>=0.8",
    "testcontainers[postgres,redis]>=4.15.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/*/src", "packages/*/src"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF",
    "ASYNC", "PT", "N", "S", "TID",
]
# Ukrainian text (prompts, KB, test data) is legitimate; Cyrillic is not a typo.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

# Services stay typed, but strict mode is required only for shared packages.
[[tool.mypy.overrides]]
module = ["gateway.*", "admin_api.*"]
disallow_untyped_decorators = false
disallow_any_generics = false

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
addopts = ["--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs Docker (testcontainers: PostgreSQL, Redis)",
]
